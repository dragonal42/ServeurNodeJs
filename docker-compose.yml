# ============================================================
# billiar.info — Serveur de jeux + SFTP avec interface web
# Déployé par Dockhand depuis GitHub (voir README.md)
# ------------------------------------------------------------
# Git  = l'INFRA (ce fichier, Dockerfile, entrypoint.sh, package.json)
# SFTP = le CODE VIVANT dans /opt/nodejs (jeux, server.js…)
#
# Tout ce qui compte vit sur le disque du serveur :
#   /opt/nodejs/   code + public/ + data/chat.db + tmp/restart.txt
#   /opt/sftpgo/   comptes & config SFTPGo
# ⇒ redéploiement Dockhand, rebuild, suppression d'image : rien
#   n'est perdu. Chemins ABSOLUS obligatoires (Dockhand clone le
#   dépôt dans son propre dossier : un chemin relatif ./xxx
#   pointerait là-bas, pas dans /opt).
#
# Variables (à renseigner dans l'onglet « Environment » de la
# stack Dockhand, ou fichier .env — voir .env.example) :
#   SFTPGO_ADMIN_PASSWORD  (obligatoire)
#   CADDY_URL              (défaut multi.billiar.info) — le jeu
#   SFTPGO_URL             (défaut sftp.billiar.info)  — interface web SFTPGo
#   SFTPGO_PORT_SFTP       (défaut 2022)               — port FileZilla
# ============================================================
services:

  # ---- Préparation (tourne ~1 s puis s'arrête : état « Exited 0 » normal) ----
  # Crée /opt/nodejs et /opt/sftpgo au 1er déploiement et leur donne
  # l'uid 1000 (utilisateur de SFTPGo), sinon SFTPGo ne peut pas écrire.
  prepare:
    image: busybox:1.36
    restart: "no"
    command: >
      sh -c "mkdir -p /opt/nodejs/public /opt/nodejs/data /opt/nodejs/tmp /opt/sftpgo
      && chown 1000:1000 /opt/nodejs /opt/nodejs/public /opt/nodejs/data /opt/nodejs/tmp
      && chown -R 1000:1000 /opt/sftpgo
      && echo 'dossiers /opt prêts'"
    volumes:
      - /opt/nodejs:/opt/nodejs
      - /opt/sftpgo:/opt/sftpgo

  lobby:
    build: .
    image: billiar-lobby:latest
    pull_policy: build         # image construite ici, jamais cherchée sur Docker Hub
    container_name: billiar-lobby
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    # Pas de port publié sur l'hôte : Caddy joint le conteneur par proxy-net
    # (billiar-lobby:3000). Évite aussi le conflit avec Dockhand, qui occupe
    # déjà le port 3000 de l'hôte.
    # Besoin d'un accès direct pour tester ?  ports: ["127.0.0.1:3001:3000"]
    expose:
      - "3000"
    labels:
      # caddy-docker-proxy : génère  CADDY_URL { reverse_proxy billiar-lobby:3000 } + HTTPS
      - "caddy=${CADDY_URL:-multi.billiar.info}"
      - "caddy.encode"
      - "caddy.reverse_proxy={{upstreams 3000}}"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/chat.db
      - WATCH=0                  # 1 = nodemon recharge à chaque .js (dev)
      - RESTART_POLL=2           # surveillance de tmp/restart.txt (s)
      - RESTART_CRASH_DELAY=5    # relance auto après plantage (s)
    volumes:
      - /opt/nodejs:/app         # UN SEUL montage : tout le projet
    networks:
      - proxy-net

  sftpgo:
    image: drakkan/sftpgo:latest
    container_name: sftpgo
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    labels:
      # Interface web SFTPGo publiée par Caddy (HTTPS auto), SANS port ouvert
      # sur l'hôte → plus aucun conflit de port possible (8080/8081/8082…).
      # → https://sftp.billiar.info/web/admin  (entrée DNS nécessaire)
      - "caddy=${SFTPGO_URL:-sftp.billiar.info}"
      - "caddy.encode"
      - "caddy.reverse_proxy={{upstreams 8080}}"
    environment:
      # Compte admin créé au 1er démarrage seulement (ensuite stocké
      # dans /opt/sftpgo ; changer la variable ne le modifie plus).
      - SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN=true
      - SFTPGO_DEFAULT_ADMIN_USERNAME=${SFTPGO_ADMIN_USER:-admin}
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=${SFTPGO_ADMIN_PASSWORD:?Définir SFTPGO_ADMIN_PASSWORD}
      # FTP classique désactivé : SFTP (FileZilla) suffit, et évite de
      # publier 2121 + la plage passive 50000-50100.
      - SFTPGO_FTPD__BINDINGS__0__PORT=0
      # Logs moins bavards (l'image est en « debug » par défaut)
      - SFTPGO_LOG_LEVEL=info
      # Anti-bruteforce : bannit temporairement les IP qui ratent leurs
      # connexions (l'interface est publique, les robots la scannent)
      - SFTPGO_COMMON__DEFENDER__ENABLED=true
    ports:
      # SFTP : SEUL port publié. Il ne peut PAS passer par Caddy (ce n'est
      # pas du HTTP), il doit donc être ouvert directement.
      # FileZilla : protocole SFTP, hôte multi.billiar.info, port ci-dessous.
      - "${SFTPGO_PORT_SFTP:-2022}:2022"
      # Accès web direct en secours (si pas de DNS pour SFTPGO_URL) :
      # décommenter avec un port LIBRE (vérifier : ss -tlnp | grep :PORT)
      # - "${SFTPGO_PORT_WEB:-8090}:8080"
    volumes:
      - /opt/sftpgo:/srv/sftpgo        # comptes/config
      - /opt/nodejs:/srv/warpclash     # home SFTP = /opt/nodejs
    networks:
      - proxy-net

# Réseau de votre Caddy (caddy-docker-proxy), comme sur vos autres serveurs.
networks:
  proxy-net:
    external: true
