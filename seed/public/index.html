<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multi.billiar.info</title>
<!--
  Page d'accueil par défaut (public/index.html).
  Remplacez-la par votre propre site : elle n'est installée que si
  public/index.html n'existe pas. Elle liste les sous-sites actifs
  grâce à /health.
-->
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b1020; color:#e8ecff; font-family:system-ui, sans-serif; }
  main { width:min(560px, 92vw); }
  h1 { font-size:1.6rem; margin:0 0 .3rem; }
  p  { color:#9aa4c7; margin:.2rem 0 1.2rem; }
  a.site { display:flex; justify-content:space-between; align-items:center; gap:1rem;
           padding:.9rem 1.1rem; margin:.5rem 0; border-radius:12px; background:#151c35;
           color:#e8ecff; text-decoration:none; border:1px solid #232c52; }
  a.site:hover { border-color:#4dd7ff; }
  small { color:#9aa4c7; } .err { color:#ff5d73; }
</style>
</head>
<body>
<main>
  <h1>🎮 multi.billiar.info</h1>
  <p>Serveur multi-sites en ligne. Sous-sites disponibles :</p>
  <div id="liste"><small>Chargement…</small></div>
</main>
<script>
fetch('/health').then(r => r.json()).then(etat => {
  const liste = document.getElementById('liste');
  liste.innerHTML = '';
  if (!etat.sites.length) liste.innerHTML = '<small>Aucun sous-site pour l’instant.</small>';
  for (const s of etat.sites) {
    const a = document.createElement('a');
    a.className = 'site';
    a.href = s.url;
    a.innerHTML = '<b></b><small></small>';
    a.querySelector('b').textContent = s.nom;
    const info = a.querySelector('small');
    info.textContent = s.statut === 'ok' ? (s.api ? 'jeu / API' : 'pages') : '⚠️ erreur';
    if (s.statut !== 'ok') info.className = 'err';
    liste.appendChild(a);
  }
}).catch(() => { document.getElementById('liste').textContent = 'Serveur injoignable.'; });
</script>
</body>
</html>
