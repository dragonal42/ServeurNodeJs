<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Attrape-étoiles — démo multijoueur</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #070b18; color: #e8ecff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px;
    }
    header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: center; }
    h1 { font-size: 1.2rem; margin: 0; }
    label { font-size: .9rem; opacity: .85; }
    input {
      background: #121a33; color: inherit; border: 1px solid #2a3560; border-radius: 6px;
      padding: 4px 8px; width: 11rem;
    }
    #terrain canvas { display: block; border-radius: 10px; border: 1px solid #2a3560; touch-action: none; }
    #infos { display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: center; font-size: .9rem; }
    #scores { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; }
    .pastille { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: .35em; vertical-align: -1px; }
    #role { color: #ffd23f; }
    small { opacity: .6; }
  </style>
</head>
<body>
  <header>
    <h1>⭐ Attrape-étoiles</h1>
    <label>Pseudo : <input id="pseudo" maxlength="20" placeholder="votre pseudo"></label>
    <span id="statut">…</span>
    <span><span id="nb">0</span> joueur(s)</span>
  </header>

  <!-- p5.js place son <canvas> ici (canvas.parent('terrain')) -->
  <main id="terrain"></main>

  <div id="infos">
    <ul id="scores"></ul>
    <span id="role"></span>
  </div>
  <small>Flèches / ZQSD / WASD, ou maintenir le clic / le doigt — premier à 10 étoiles gagne la manche.
    Ouvrez la page dans un 2ᵉ onglet pour tester à plusieurs !</small>

  <!-- Client Socket.IO : servi automatiquement par le serveur (aucun fichier à déposer) -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- p5.js embarqué localement (public/lib/) : pas de CDN nécessaire -->
  <script src="lib/p5.min.js"></script>
  <!-- Le jeu (commenté) -->
  <script src="jeu.js"></script>
</body>
</html>
